<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box (Centralização absoluta com flexbox)</title>
    <style>

        /*CENTRALIZAÇÃO ABSOLUTA DO FLEXBOX 

            Para isso basta colocar o:
                JUSTIFY-CONTENT: CENTER
                ALIGN-ITEMS: CENTER
        */

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-color: lightsalmon;
            
        }

        main{
            background-color: lightgreen;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;

        }

        section{
            background-color: lightseagreen;
            height: 200px;
            width: 200px;
        }

    </style>
</head>
<body>
    <main>
        <section>
            <h1>TELA DE LOGIN</h1>
        </section>
    </main>
</body>
</html>
